<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@bymarinamay palette — estimates</title>
<style>body{font-family:Arial,sans-serif;background:#f6f3ee;margin:32px 16px}h1{font-size:22px}p{color:#555;max-width:720px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.sw{border:0;border-radius:12px;padding:16px;min-height:86px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font:inherit;cursor:pointer}.sw span{font-family:monospace;font-size:15px}.sw.copied span::after{content:"  copied"}</style></head>
<body><h1>@bymarinamay — Topic-Coded Palette</h1><p>Visual estimates (~) from the 2026-10-24 audit, not sampled from source files. Rule: one flat grainy ground per carousel, hue codes the topic. Click a swatch to copy its hex; hover for its role.</p><div class="grid"><button class="sw" style="background:#C8102E;color:#ffffff" data-hex="#C8102E" title="Arches, banners, horror accent, logo divider"><b>Signature Blood Red</b><span>#C8102E</span></button>
<button class="sw" style="background:#A3203A;color:#ffffff" data-hex="#A3203A" title="Substack mark field, deep red alternative"><b>Substack Grain Crimson</b><span>#A3203A</span></button>
<button class="sw" style="background:#D92B2B;color:#ffffff" data-hex="#D92B2B" title="Reel covers, diary covers"><b>Reel Cover Red</b><span>#D92B2B</span></button>
<button class="sw" style="background:#3A2A20;color:#ffffff" data-hex="#3A2A20" title="Upcoming central panel — the constant"><b>Panel Brown</b><span>#3A2A20</span></button>
<button class="sw" style="background:#3A3A3A;color:#ffffff" data-hex="#3A3A3A" title="Queer Vampires ground"><b>Charcoal Vampire</b><span>#3A3A3A</span></button>
<button class="sw" style="background:#111111;color:#ffffff" data-hex="#111111" title="Titles on light grounds"><b>Ink Black</b><span>#111111</span></button>
<button class="sw" style="background:#F3EAD8;color:#111111" data-hex="#F3EAD8" title="Folk Horror type, Greek meander, light text on navy/brown"><b>Cream Poster</b><span>#F3EAD8</span></button>
<button class="sw" style="background:#2B3A55;color:#ffffff" data-hex="#2B3A55" title="Folk Horror ground"><b>Folk Navy</b><span>#2B3A55</span></button>
<button class="sw" style="background:#7FA653;color:#111111" data-hex="#7FA653" title="Upcoming Films early ground (Pt.7)"><b>Upcoming Olive</b><span>#7FA653</span></button>
<button class="sw" style="background:#8AA85C;color:#111111" data-hex="#8AA85C" title="Upcoming Olive highlight/grain variation"><b>Upcoming Olive Light</b><span>#8AA85C</span></button>
<button class="sw" style="background:#B9A8E0;color:#111111" data-hex="#B9A8E0" title="Upcoming Pt.30 ground"><b>Upcoming Lavender</b><span>#B9A8E0</span></button>
<button class="sw" style="background:#F2B8CE;color:#111111" data-hex="#F2B8CE" title="Queer Movies film slides"><b>Queer Pink</b><span>#F2B8CE</span></button>
<button class="sw" style="background:#E8A8C8;color:#111111" data-hex="#E8A8C8" title="Queer Movies cover gradient top"><b>Queer Gradient Pink</b><span>#E8A8C8</span></button>
<button class="sw" style="background:#A8B8E8;color:#111111" data-hex="#A8B8E8" title="Queer Movies cover gradient bottom"><b>Queer Gradient Lavender-Blue</b><span>#A8B8E8</span></button>
<button class="sw" style="background:#E87E2E;color:#111111" data-hex="#E87E2E" title="Greek Myth ground"><b>Greek Burnt Orange</b><span>#E87E2E</span></button>
<button class="sw" style="background:#F07A2A;color:#111111" data-hex="#F07A2A" title="Greek Myth variation"><b>Greek Burnt Orange Alt</b><span>#F07A2A</span></button>
<button class="sw" style="background:#BFD6DB;color:#111111" data-hex="#BFD6DB" title="FrameXFrame Instagram ground"><b>Essay Pale Blue</b><span>#BFD6DB</span></button>
<button class="sw" style="background:#A9C6CC;color:#111111" data-hex="#A9C6CC" title="FrameXFrame shading/highlight"><b>Essay Pale Blue Deep</b><span>#A9C6CC</span></button>
<button class="sw" style="background:#DCE6EA;color:#111111" data-hex="#DCE6EA" title="Substack page ground/header band"><b>Substack Pale</b><span>#DCE6EA</span></button>
<button class="sw" style="background:#F28BB4;color:#111111" data-hex="#F28BB4" title="Pt.30 sticker system — primary"><b>Sticker Pink</b><span>#F28BB4</span></button>
<button class="sw" style="background:#8B7FD4;color:#111111" data-hex="#8B7FD4" title="Pt.30 sticker system — secondary"><b>Sticker Purple</b><span>#8B7FD4</span></button>
<button class="sw" style="background:#A8D8B9;color:#111111" data-hex="#A8D8B9" title="Classic sticker system accent"><b>Sticker Mint</b><span>#A8D8B9</span></button>
<button class="sw" style="background:#E9B949;color:#111111" data-hex="#E9B949" title="Classic sticker / Highlights"><b>Sticker Mustard</b><span>#E9B949</span></button>
<button class="sw" style="background:#2A9D8F;color:#111111" data-hex="#2A9D8F" title="Classic sticker accent"><b>Sticker Teal</b><span>#2A9D8F</span></button>
<button class="sw" style="background:#A8C8E8;color:#111111" data-hex="#A8C8E8" title="Classic sticker / Drama"><b>Sticker Sky</b><span>#A8C8E8</span></button>
</div>
<script>document.querySelectorAll('.sw').forEach(function(b){b.addEventListener('click',function(){var h=b.dataset.hex;try{navigator.clipboard.writeText(h).then(function(){b.classList.add('copied');setTimeout(function(){b.classList.remove('copied')},1200)})}catch(e){prompt('Copy hex:',h)}})});</script>
</body></html>
